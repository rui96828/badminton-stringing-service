<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站后台 - 羽毛球穿线服务</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --line: #e3e7ef;
            --text: #1f2430;
            --muted: #6b7280;
            --primary: #1f6feb;
            --primary-dark: #1758c4;
            --danger: #d64545;
            --ok: #1a7f4b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, .94);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }
        .topbar h1 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 10px; }
        .topbar h1 span { font-weight: 400; font-size: 12px; color: var(--muted); }
        .actions { display: flex; align-items: center; gap: 10px; }
        .actions a { color: var(--muted); text-decoration: none; font-size: 13px; }
        .actions a:hover { color: var(--primary); }
        button {
            font: inherit;
            cursor: pointer;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--text);
            padding: 8px 14px;
            border-radius: 8px;
        }
        button:hover { border-color: #c9d1e0; }
        button.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            font-weight: 600;
        }
        button.primary:hover { background: var(--primary-dark); }
        button.primary:disabled { opacity: .6; cursor: default; }
        button.danger { color: var(--danger); border-color: #f0c9c9; }
        main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 80px; }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;
        }
        .card > h2 {
            font-size: 15px;
            margin: 0 0 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card > h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .full { grid-column: 1 / -1; }
        label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #374151; }
        label.f .hint { font-size: 12px; color: var(--muted); }
        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 9px 11px;
            font: inherit;
            background: #fff;
            color: var(--text);
        }
        input:focus, textarea:focus { outline: 2px solid rgba(31, 111, 235, .18); border-color: var(--primary); }
        textarea { resize: vertical; min-height: 76px; }
        .checks { flex-direction: row; align-items: center; gap: 8px; padding-top: 24px; }
        .checks input { width: auto; }
        .item-row { border: 1px dashed var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
        .item-row .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .item-row .head strong { font-size: 13px; }
        .item-row .head button { padding: 4px 10px; font-size: 12px; }
        .add-row { width: 100%; border-style: dashed; color: var(--primary); }
        .tip {
            background: #fff8e6;
            border: 1px solid #f3e0ae;
            color: #7a5a12;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 16px;
        }
        .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
        #toast {
            position: fixed;
            left: 50%;
            bottom: 26px;
            transform: translateX(-50%) translateY(20px);
            background: #1f2430;
            color: #fff;
            padding: 10px 18px;
            border-radius: 999px;
            opacity: 0;
            pointer-events: none;
            transition: all .25s ease;
            font-size: 13px;
            z-index: 50;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #toast.error { background: var(--danger); }
        #toast.ok { background: var(--ok); }
        @media (max-width: 720px) {
            .grid, .grid.three { grid-template-columns: 1fr; }
            .topbar { padding: 10px 12px; }
            .topbar h1 span { display: none; }
            main { padding: 14px 10px 70px; }
            .card { padding: 14px; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <h1>🏸 网站后台 <span id="saveState">修改后记得保存</span></h1>
        <div class="actions">
            <a href="/" target="_blank" rel="noopener">查看网站 ↗</a>
            <button class="primary" id="saveBtn">保存修改</button>
        </div>
    </header>

    <main id="app"></main>
    <div id="toast"></div>

    <script src="content.js"></script>
    <script>
        (function () {
            'use strict';

            const app = document.getElementById('app');
            const saveBtn = document.getElementById('saveBtn');
            const saveState = document.getElementById('saveState');
            const toast = document.getElementById('toast');

            if (!window.SITE_CONFIG) {
                app.innerHTML = '<div class="card">没有读取到网站配置，请确认 content.js 存在。</div>';
                return;
            }

            const cfg = JSON.parse(JSON.stringify(window.SITE_CONFIG));
            cfg.site = cfg.site || {};
            cfg.notices = cfg.notices || {};
            cfg.pricing = cfg.pricing || {};
            cfg.schedule = cfg.schedule || {};
            cfg.service = cfg.service || {};
            cfg.pricing.grommets = cfg.pricing.grommets || [];
            cfg.pricing.strings = cfg.pricing.strings || [];
            cfg.pricing.grips = cfg.pricing.grips || [];
            cfg.schedule.dropoffSlots = cfg.schedule.dropoffSlots || [];
            cfg.schedule.pickupSlots = cfg.schedule.pickupSlots || [];
            cfg.service.features = cfg.service.features || [];
            cfg.service.tensionTips = cfg.service.tensionTips || [];

            const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));

            const get = (p) => p.split('.').reduce((o, k) => (o == null ? undefined : o[k]), cfg);
            const put = (p, v) => {
                const keys = p.split('.');
                let o = cfg;
                keys.slice(0, -1).forEach(k => { o = o[k] = o[k] || {}; });
                o[keys[keys.length - 1]] = v;
            };

            function field(label, path, opts) {
                opts = opts || {};
                const value = get(path);
                if (opts.textarea) {
                    return '<label class="f ' + (opts.full ? 'full' : '') + '">' + esc(label) +
                        '<textarea data-path="' + path + '" rows="' + (opts.rows || 3) + '">' + esc(value) + '</textarea>' +
                        (opts.hint ? '<span class="hint">' + esc(opts.hint) + '</span>' : '') + '</label>';
                }
                return '<label class="f ' + (opts.full ? 'full' : '') + '">' + esc(label) +
                    '<input type="' + (opts.number ? 'number' : 'text') + '" step="' + (opts.step || 'any') + '" data-path="' + path + '" value="' + esc(value) + '">' +
                    (opts.hint ? '<span class="hint">' + esc(opts.hint) + '</span>' : '') + '</label>';
            }

            function linesField(label, key, value, hint, rows) {
                return '<label class="f full">' + esc(label) +
                    '<textarea data-list="' + key + '" rows="' + (rows || 4) + '">' + esc((value || []).join('\n')) + '</textarea>' +
                    (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</label>';
            }

            function itemRow(name, item, index, fields) {
                const labels = {
                    name: '名称', short: '简称（选项里显示）', price: '价格（元）',
                    desc: '卖点（价格后面）', tip: '额外提示', badges: '角标（逗号分隔）'
                };
                let body = '';
                fields.forEach(f => {
                    if (f === 'featured' || f === 'recommended') {
                        body += '<label class="f checks"><input type="checkbox" data-arr="' + name + '" data-i="' + index +
                            '" data-f="' + f + '"' + (item[f] ? ' checked' : '') + '> ' + (f === 'featured' ? '重点展示' : '推荐') + '</label>';
                        return;
                    }
                    if (f === 'badges') {
                        body += '<label class="f">' + labels[f] + '<input type="text" data-arr="' + name + '" data-i="' + index +
                            '" data-f="badges" value="' + esc((item.badges || []).join('，')) + '"></label>';
                        return;
                    }
                    const isNumber = f === 'price';
                    body += '<label class="f">' + labels[f] + '<input type="' + (isNumber ? 'number' : 'text') + '"' +
                        (isNumber ? ' step="0.1"' : '') + ' data-arr="' + name + '" data-i="' + index + '" data-f="' + f +
                        '" value="' + esc(item[f]) + '"></label>';
                });
                const canDelete = name !== 'grommets';
                return '<div class="item-row">' +
                    '<div class="head"><strong>' + esc(item.name || ('条目 ' + (index + 1))) + '</strong>' +
                    (canDelete ? '<button type="button" class="danger" data-remove="' + name + '" data-i="' + index + '">删除</button>' : '') +
                    '</div><div class="grid three">' + body + '</div></div>';
            }

            function render() {
                const strings = cfg.pricing.strings.map((s, i) =>
                    itemRow('strings', s, i, ['name', 'price', 'desc', 'tip', 'badges', 'featured', 'recommended'])).join('');
                const grips = cfg.pricing.grips.map((s, i) => itemRow('grips', s, i, ['name', 'price'])).join('');
                const grommets = cfg.pricing.grommets.map((s, i) => itemRow('grommets', s, i, ['name', 'short', 'price'])).join('');

                app.innerHTML = `
                    <div class="tip">这里的修改保存后会立即生效，刷新网站即可看到。价格单位是元，可以填小数。</div>

                    <section class="card">
                        <h2>基本信息</h2>
                        <div class="grid">
                            ${field('浏览器标题', 'site.title')}
                            ${field('店铺名称', 'site.brand')}
                            ${field('副标题', 'site.subtitle')}
                            ${field('联系电话', 'site.phone', { hint: '地址说明里的 {phone} 会自动替换成这个号码' })}
                            ${field('电话后备注', 'site.phoneNote')}
                            ${field('页脚文字', 'site.footer')}
                        </div>
                    </section>

                    <section class="card">
                        <h2>提示与说明</h2>
                        <div class="grid">
                            ${field('防诈骗提示标题', 'notices.fraudTitle')}
                            ${field('送达地址', 'notices.address')}
                            ${field('防诈骗提示内容', 'notices.fraudText', { textarea: true, rows: 3 })}
                            ${field('地址说明', 'notices.addressNote', { textarea: true, rows: 3 })}
                            ${field('球拍检查提示标题', 'notices.safetyTitle')}
                            ${field('球拍检查提示内容', 'notices.safetyText', { textarea: true, rows: 3 })}
                            ${field('电话填写提醒', 'notices.contactNotice', { textarea: true, rows: 2 })}
                            ${field('地址栏标题', 'notices.addressTitle')}
                            ${field('球线库存提示标题', 'notices.stringStockTitle')}
                            ${field('球线库存提示内容', 'notices.stringStockText', { textarea: true, rows: 4 })}
                            ${field('手胶提醒标题', 'notices.gripNoticeTitle')}
                            ${field('手胶提醒内容', 'notices.gripNoticeText', { textarea: true, rows: 3 })}
                            ${field('付款说明', 'notices.paymentNote')}
                            ${field('护线管小贴士（可含 HTML）', 'notices.grommetTip', { textarea: true, rows: 3 })}
                        </div>
                        ${linesField('价格表下面的备注', 'priceNotes', cfg.notices.priceNotes, '每行一条')}
                    </section>

                    <section class="card">
                        <h2>价格与商品</h2>
                        <div class="grid">
                            ${field('穿线手工费（每支）', 'pricing.labor', { number: true, step: '0.1' })}
                        </div>
                        <h2 style="margin-top:18px">护线管 <small>名称和价格可改</small></h2>
                        ${grommets}
                        <h2 style="margin-top:18px">球线 <small>可增删</small></h2>
                        ${strings || '<p class="note">暂无球线</p>'}
                        <button type="button" class="add-row" data-add="strings">+ 添加球线</button>
                        <h2 style="margin-top:18px">手胶 <small>可增删</small></h2>
                        ${grips || '<p class="note">暂无手胶</p>'}
                        <button type="button" class="add-row" data-add="grips">+ 添加手胶</button>
                    </section>

                    <section class="card">
                        <h2>预约时段</h2>
                        <div class="grid">
                            ${linesField('送拍时段（每行一个）', 'dropoffSlots', cfg.schedule.dropoffSlots, '格式：08:00-09:00', 8)}
                            ${linesField('取拍时段（每行一个）', 'pickupSlots', cfg.schedule.pickupSlots, '格式：08:00-09:00', 8)}
                        </div>
                    </section>

                    <section class="card">
                        <h2>页面文案</h2>
                        <div class="grid">
                            ${linesField('服务说明（每行一条）', 'features', cfg.service.features, '前面的 ✅ 也可以自己改', 6)}
                            ${linesField('磅数建议（每行一条，格式：人群|磅数）', 'tensionTips', cfg.service.tensionTips.map(t => t.label + '|' + t.range), '例如：初学者|20-22 磅', 6)}
                            ${field('磅数说明', 'service.tensionNote', { textarea: true, rows: 2 })}
                        </div>

                    </section>

                    <section class="card">
                        <h2>其他</h2>
                        <div class="grid">
                            ${field('Web3Forms 表单密钥', 'integrations.web3formsKey', { full: true, hint: '更换邮箱接收订单时才需要改' })}
                        </div>
                        <p class="note">后台地址：/admin。部署到 Railway 时请挂载持久化磁盘并设置 DATA_DIR=/data，否则重新部署会恢复默认内容。</p>
                    </section>
                `;
            }

            function collect() {
                app.querySelectorAll('[data-path]').forEach(el => {
                    let v = el.value;
                    if (el.type === 'number') v = Number(v);
                    put(el.dataset.path, v);
                });

                ['grommets', 'strings', 'grips'].forEach(name => {
                    cfg.pricing[name] = cfg.pricing[name].map((item, i) => {
                        const out = Object.assign({}, item);
                        const read = (f) => {
                            const el = app.querySelector('[data-arr="' + name + '"][data-i="' + i + '"][data-f="' + f + '"]');
                            if (!el) return item[f];
                            if (el.type === 'checkbox') return el.checked;
                            if (el.type === 'number') return Number(el.value);
                            return el.value;
                        };
                        const fields = name === 'grommets' ? ['name', 'short', 'price']
                            : name === 'strings' ? ['name', 'price', 'desc', 'tip']
                                : ['name', 'price'];
                        fields.forEach(f => { out[f] = read(f); });
                        if (name === 'strings') {
                            out.badges = String(read('badges') || '').split(/[,，、]/).map(s => s.trim()).filter(Boolean);
                            out.featured = !!read('featured');
                            out.recommended = !!read('recommended');
                        }
                        return out;
                    });
                });

                const readLines = (key) => {
                    const el = app.querySelector('[data-list="' + key + '"]');
                    return el ? el.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean) : [];
                };

                cfg.notices.priceNotes = readLines('priceNotes');
                cfg.schedule.dropoffSlots = readLines('dropoffSlots');
                cfg.schedule.pickupSlots = readLines('pickupSlots');
                cfg.service.features = readLines('features');
                cfg.service.tensionTips = readLines('tensionTips').map(line => {
                    const i = line.indexOf('|');
                    return i < 0 ? { label: line, range: '' } : { label: line.slice(0, i).trim(), range: line.slice(i + 1).trim() };
                }).filter(t => t.label);
            }

            function showToast(message, type) {
                toast.textContent = message;
                toast.className = 'show ' + (type || '');
                clearTimeout(showToast.timer);
                showToast.timer = setTimeout(() => { toast.className = ''; }, 2600);
            }

            app.addEventListener('click', (event) => {
                const add = event.target.closest('[data-add]');
                if (add) {
                    collect();
                    const name = add.dataset.add;
                    const key = 'custom' + Date.now();
                    cfg.pricing[name].push(name === 'strings'
                        ? { key: key, name: '新球线', price: 20, desc: '', tip: '', badges: [], featured: false, recommended: false }
                        : { key: key, name: '新手胶', price: 5 });
                    render();
                    saveState.textContent = '有未保存的修改';
                    return;
                }
                const del = event.target.closest('[data-remove]');
                if (del) {
                    collect();
                    const name = del.dataset.remove;
                    cfg.pricing[name].splice(Number(del.dataset.i), 1);
                    render();
                    saveState.textContent = '有未保存的修改';
                }
            });

            app.addEventListener('input', () => { saveState.textContent = '有未保存的修改'; });
            app.addEventListener('change', () => { saveState.textContent = '有未保存的修改'; });

            saveBtn.addEventListener('click', async () => {
                collect();
                saveBtn.disabled = true;
                saveBtn.textContent = '保存中...';
                try {
                    const resp = await fetch('/api/content', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(cfg)
                    });
                    if (resp.status === 401) {
                        showToast('登录已失效，请刷新页面重新输入密码', 'error');
                        return;
                    }
                    const data = await resp.json();
                    if (!resp.ok) throw new Error(data.error || '保存失败');
                    saveState.textContent = '已保存 ' + new Date().toLocaleTimeString('zh-CN');
                    showToast('保存成功，网站已更新', 'ok');
                } catch (err) {
                    showToast(err.message || '保存失败，请重试', 'error');
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.textContent = '保存修改';
                }
            });

            render();
        })();
    </script>
</body>
</html>
